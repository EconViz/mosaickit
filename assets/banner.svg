<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="mosaickit">
  <title>mosaickit</title>

  <!-- A small scene assembled from independent tiles/layers. -->
  <g transform="translate(24, 24)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="8" fill="#181818"/>
    <rect x="60" y="4" width="48" height="48" rx="8" fill="#8a8a8a"/>
    <rect x="4" y="60" width="48" height="48" rx="8" fill="#c9c9c9"/>
    <rect x="60" y="60" width="48" height="48" rx="8" fill="#f3f3f3" stroke="#181818" stroke-width="3"/>

    <!-- Primitive layers crossing tile boundaries form one coherent diagram. -->
    <path d="M 16 91 L 34 72 L 49 80 L 70 35 L 94 18" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="34" cy="72" r="5" fill="#181818" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 69 92 L 92 69" fill="none" stroke="#181818" stroke-width="5"/>
    <path d="M 84 69 H 92 V 77" fill="none" stroke="#181818" stroke-width="4"/>
  </g>

  <!-- Wordmark follows the BezierKit family treatment. -->
  <text x="160" y="98" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="52" font-weight="700" letter-spacing="-1" fill="#181818">mosaic<tspan fill="#8a8a8a">kit</tspan></text>
</svg>
