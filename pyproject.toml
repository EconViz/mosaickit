[project]
name = "mosaickit"
version = "0.4.0"
description = "Domain-neutral scenes, styles, and rendering for EconViz."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "EconViz" }]
dependencies = ["numpy>=1.24", "matplotlib>=3.6,<4", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/EconViz/mosaickit"
Repository = "https://github.com/EconViz/mosaickit"
Issues = "https://github.com/EconViz/mosaickit/issues"
Changelog = "https://github.com/EconViz/mosaickit/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/EconViz/mosaickit/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaickit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "assets", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pre-commit>=4", "mypy>=1.13", "import-linter>=2", "build>=1", "pillow>=10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.mypy]
files = ["src/mosaickit"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.importlinter]
root_package = "mosaickit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Models do not depend on rendering or canvas"
type = "forbidden"
source_modules = ["mosaickit.scene", "mosaickit.styles", "mosaickit.themes", "mosaickit.parameter"]
forbidden_modules = ["mosaickit.rendering", "mosaickit.canvas"]

[[tool.importlinter.contracts]]
name = "Core never imports domain packages"
type = "forbidden"
source_modules = ["mosaickit"]
forbidden_modules = ["econ_viz", "utility_viz", "micro_viz", "macro_viz", "trade_viz", "dsge_viz", "principle_viz"]

[[tool.importlinter.contracts]]
name = "Layout is pure geometry"
type = "forbidden"
source_modules = ["mosaickit.layout"]
forbidden_modules = [
    "mosaickit.scene", "mosaickit.styles", "mosaickit.themes", "mosaickit.palette",
    "mosaickit.config", "mosaickit.canvas", "mosaickit.rendering", "matplotlib",
]

[[tool.importlinter.contracts]]
name = "Scene models know nothing about themes, layout, or config"
type = "forbidden"
source_modules = ["mosaickit.scene"]
forbidden_modules = ["mosaickit.themes", "mosaickit.palette", "mosaickit.layout", "mosaickit.config"]

[[tool.importlinter.contracts]]
name = "Only the Matplotlib backend imports Matplotlib"
type = "forbidden"
source_modules = [
    "mosaickit.scene", "mosaickit.styles", "mosaickit.themes", "mosaickit.palette",
    "mosaickit.colors", "mosaickit.parameter", "mosaickit.layout", "mosaickit.canvas",
    "mosaickit.config", "mosaickit.canvas_spec", "mosaickit.interval", "mosaickit.errors",
    "mosaickit.rendering.plan", "mosaickit.rendering.cache", "mosaickit.rendering.context",
    "mosaickit.rendering.protocol", "mosaickit.rendering.registry",
]
forbidden_modules = ["matplotlib"]
